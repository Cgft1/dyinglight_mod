name: Build Dying Light Fabric Mod
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: dyinglight-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
