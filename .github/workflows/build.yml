name: Build Dying Light Fabric Mod
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build mod
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1
          result=$?
          tail -n 250 build.log
          exit $result
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyinglight-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dyinglight-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
